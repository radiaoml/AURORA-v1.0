<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA // MAP INTELLIGENCE AGENT</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --riot-red: #ff4655;
            --tactical-cyan: #00f5d4;
            --neural-blue: #3b82f6;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(255, 70, 85, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--neural-blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--neural-blue);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .upload-zone {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 60px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            margin-bottom: 30px;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--neural-blue);
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .upload-text {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .lore-report {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 245, 212, 0.05);
            border: 1px solid rgba(0, 245, 212, 0.2);
            border-radius: 5px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #a3e635;
            /* A subtle green for lore */
            font-family: var(--font-mono);
        }

        .lore-report h3 {
            color: var(--tactical-cyan);
            font-size: 1rem;
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(0, 245, 212, 0.1);
            padding-bottom: 5px;
        }

        #preview-container {
            margin-top: 20px;
            display: none;
        }

        #image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .actions {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 4px;
            font-family: var(--font-main);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--riot-red);
            color: white;
            box-shadow: 0 0 20px rgba(255, 70, 85, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #results-area {
            display: none;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-left: 4px solid var(--tactical-cyan);
            padding: 30px;
            font-family: var(--font-mono);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            color: var(--tactical-cyan);
            font-size: 0.7rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 245, 212, 0.1);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .analysis-output {
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .analysis-output b {
            color: var(--neural-blue);
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        input[type="file"] {
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 3px;
            font-size: 0.65rem;
            color: var(--tactical-cyan);
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 70, 85, 0.4);
                border-color: rgba(255, 70, 85, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 70, 85, 0);
                border-color: rgba(255, 70, 85, 0.2);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 70, 85, 0);
                border-color: rgba(255, 70, 85, 0.4);
            }
        }

        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .dashboard-grid::-webkit-scrollbar {
            width: 6px;
        }

        .dashboard-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .dashboard-grid::-webkit-scrollbar-thumb {
            background: rgba(0, 245, 212, 0.2);
            border-radius: 3px;
        }

        .section-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            transition: 0.3s;
        }

        .section-card:hover {
            border-color: rgba(0, 245, 212, 0.1);
            background: rgba(255, 255, 255, 0.04);
        }

        .section-header {
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>AURORA // MAP AGENT <span class="badge">GEMINI VISION</span></h1>
            <p class="subtitle">Spatial Intelligence Interface · Powered by Gemini 1.5 Flash</p>
        </header>

        <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <span class="upload-icon">📡</span>
            <p class="upload-text">DRAG & DROP GAMEPLAY SCREENSHOT OR CLICK TO BROWSE</p>
            <div id="preview-container">
                <img id="image-preview" src="#" alt="Preview">
            </div>
        </div>

        <input type="file" id="file-input" accept="image/*">

        <div class="actions">
            <button id="analyze-btn" class="btn btn-primary" disabled onclick="runAnalysis()">
                <span class="loader" id="loader"></span>
                <span id="btn-text">INITIALIZE ANALYZER</span>
            </button>
        </div>

        <div id="results-area">
            <div class="result-header">
                <span>INTEL_STREAM · GEMINI VISION + ORACLE</span>
                <span id="timestamp">TIMESTAMP // --:--:--</span>
            </div>
            <div id="output-content" class="analysis-output">
                <!-- Analysis results will appear here -->
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('image-preview');
        const previewContainer = document.getElementById('preview-container');
        const analyzeBtn = document.getElementById('analyze-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');
        const resultsArea = document.getElementById('results-area');
        const outputContent = document.getElementById('output-content');
        const timestamp = document.getElementById('timestamp');

        let currentFile = null;

        // Drag & Drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
            dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            currentFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                previewContainer.style.display = 'block';
                dropZone.querySelector('.upload-icon').style.display = 'none';
                dropZone.querySelector('.upload-text').style.display = 'none';
                analyzeBtn.disabled = false;
                btnText.textContent = 'ANALYZE IMAGE';
            };
            reader.readAsDataURL(file);
        }

        async function runAnalysis() {
            if (!currentFile) return;
            analyzeBtn.disabled = true;
            loader.style.display = 'inline-block';
            btnText.textContent = 'GEMINI VISION PROCESSING...';
            resultsArea.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', currentFile);

                const response = await fetch('http://localhost:8001/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Server error');
                }

                displayResults(await response.json());

            } catch (e) {
                console.error('Analysis error:', e);
                displayResults({
                    map: 'AGENT OFFLINE',
                    location: 'N/A',
                    tactical_advice: `${e.message}. Make sure map_agent_server.py is running on port 8001.`,
                    confidence: 'none',
                    source: 'Connection Failed'
                });
            }

            resultsArea.style.display = 'block';
            loader.style.display = 'none';
            btnText.textContent = 'RUN NEW ANALYSIS';
            analyzeBtn.disabled = false;
        }

        function displayResults(data) {
            const now = new Date();
            timestamp.textContent = `TIMESTAMP // ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            const coordStr = data.coordinates
                ? `X: ${Math.round(data.coordinates.x)}, Y: ${Math.round(data.coordinates.y)}`
                : 'N/A';

            function renderStructuredReport(blocks) {
                if (!blocks || !Array.isArray(blocks)) return null;
                return blocks.map(block => {
                    switch (block.type) {
                        case 'header':
                            return `<p style="color: #00f5d4; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid rgba(0, 245, 212, 0.2); display: inline-block;">${block.content}</p>`;
                        case 'bullet':
                            return `<div style="display: flex; gap: 8px; margin-bottom: 6px; padding-left: 5px;">
                                        <span style="color: #00f5d4;">•</span>
                                        <span style="color: #cbd5e1; font-size: 0.82rem; line-height: 1.4;">${block.content}</span>
                                    </div>`;
                        case 'tip':
                            return `<div style="margin: 10px 0; padding: 8px 12px; background: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; border-radius: 4px; font-size: 0.8rem; color: #93c5fd;">
                                        <span style="font-weight: bold; color: #3b82f6; margin-right: 5px;">💡 PRO TIP:</span> ${block.content}
                                    </div>`;
                        case 'warning':
                            return `<div style="margin: 10px 0; padding: 8px 12px; background: rgba(255, 70, 85, 0.1); border-left: 3px solid #ff4655; border-radius: 4px; font-size: 0.8rem; color: #fca5a5;">
                                        <span style="font-weight: bold; color: #ff4655; margin-right: 5px;">⚠️ URGENT:</span> ${block.content}
                                    </div>`;
                        default:
                            return `<p style="color: #cbd5e1; font-size: 0.82rem; line-height: 1.5; margin-bottom: 10px;">${block.content}</p>`;
                    }
                }).join('');
            }

            const tacticalHtml = data.tactical_advice_beautified
                ? renderStructuredReport(data.tactical_advice_beautified)
                : `<p style="color: #f8fafc; font-style: italic; line-height: 1.4;">"${data.tactical_advice}"</p>`;

            const visualHtml = data.visual_cues_beautified
                ? renderStructuredReport(data.visual_cues_beautified)
                : `<p style="color:#64748b;font-size:0.8rem;margin-top:8px;">👁️ VISUAL CUES: ${data.visual_cues}</p>`;

            outputContent.innerHTML = `
                <div class="dashboard-grid">
                    <!-- SECTION 1: STRATEGIC HUD -->
                    <div class="section-card">
                        <div class="section-header">🛰️ Strategic HUD</div>
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            <p style="display: flex; align-items: center; gap: 10px; margin: 0;">
                                📍 MAP: <b style="color: #fff;">${data.map || 'UNKNOWN'}</b> 
                                ${data.tactical_description ? `<span style="background: rgba(0, 245, 212, 0.1); color: #00f5d4; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; border: 1px solid rgba(0, 245, 212, 0.2); letter-spacing: 0.5px;">${data.tactical_description}</span>` : ''}
                                <div style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
                                    ${data.tactical_state ? `<span style="background: ${data.tactical_state.enemy_detected ? 'rgba(255, 70, 85, 0.15)' : 'rgba(0, 245, 212, 0.1)'}; color: ${data.tactical_state.enemy_detected ? '#ff4655' : '#00f5d4'}; padding: 2px 10px; border-radius: 4px; font-size: 0.7rem; border: 1px solid ${data.tactical_state.enemy_detected ? 'rgba(255, 70, 85, 0.3)' : 'rgba(0, 245, 212, 0.2)'}; letter-spacing: 0.7px; font-weight: bold; animation: ${data.tactical_state.enemy_detected ? 'pulse 1.5s infinite' : 'none'};">${data.tactical_state.status_msg}</span>` : ''}
                                    ${data.round_context && data.round_context.time ? `<span style="background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; border: 1px solid rgba(59, 130, 246, 0.2); letter-spacing: 0.5px;">TIME: ${data.round_context.time}</span>` : ''}
                                    ${data.round_context && data.round_context.score ? `<span style="background: rgba(255, 70, 85, 0.1); color: #ff4655; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; border: 1px solid rgba(255, 70, 85, 0.2); letter-spacing: 0.5px;">SCORE: ${data.round_context.score}</span>` : ''}
                                </div>
                            </p>
                            <p style="margin: 0; font-size: 0.9rem;">🛰️ SECTOR: <b style="color: #3b82f6;">${data.location || 'UNKNOWN'}</b> &nbsp;|&nbsp; 🎯 ZONE: <b style="color: #fff;">${data.super_region || 'N/A'}</b></p>
                        </div>
                    </div>

                    <!-- SECTION 2: GEOSPATIAL INTELLIGENCE -->
                    <div class="section-card">
                        <div class="section-header">🌍 Geospatial Intelligence</div>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                                <p style="margin: 0; font-size: 0.8rem; color: #cbd5e1;">📐 COORDS: <b>${coordStr}</b></p>
                                ${data.precise_z !== null && data.precise_z !== undefined ? `<p style="margin: 0; color: #00f5d4; font-size: 0.8rem;">⛰️ ELEVATION: <b>${Math.round(data.precise_z)}</b> <span style="color: #64748b; font-size: 0.7rem;">(${data.elevation_label || 'Standard Level'})</span></p>` : ''}
                                ${data.lore_coordinates ? `<p style="margin:0; color: #3b82f6; font-size: 0.75rem; background: rgba(59, 130, 246, 0.05); padding: 2px 8px; border-radius: 4px;">🛰️ LORE: ${data.lore_coordinates}</p>` : ''}
                                ${data.map_uuid ? `<p style="margin:0; color: #64748b; font-size: 0.65rem; font-family: monospace; background: rgba(255, 255, 255, 0.03); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.05);">🆔 RIOT UUID: ${data.map_uuid}</p>` : ''}
                            </div>
                            
                            ${data.lore_context ? `
                            <div style="margin-top: 8px; padding: 10px; background: rgba(59, 130, 246, 0.05); border-left: 3px solid #3b82f6; border-radius: 4px;">
                                <p style="color: #3b82f6; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; text-transform: uppercase;">🌍 GEO-DISCOVERY: ${data.lore_context.geographic_discovery}</p>
                                <p style="color: #94a3b8; font-size: 0.8rem; font-style: italic; line-height: 1.4; margin: 0;">"${data.lore_context.lore_report}"</p>
                            </div>
                            ` : ''}
                        </div>
                    </div>

                    <!-- SECTION 3: MISSION OBJECTIVE -->
                    ${data.spike_status ? `
                    <div class="section-card" style="border-color: ${data.spike_status.is_planted ? 'rgba(255, 70, 85, 0.3)' : 'rgba(255, 255, 255, 0.05)'};">
                        <div class="section-header">💣 Mission Objective</div>
                        <div style="border: 1px solid ${data.spike_status.is_planted ? 'rgba(255, 70, 85, 0.4)' : 'rgba(255, 255, 255, 0.1)'}; background: ${data.spike_status.is_planted ? 'rgba(255, 70, 85, 0.1)' : 'rgba(255, 255, 255, 0.02)'}; padding: 12px; border-radius: 6px; position: relative; overflow: hidden;">
                            ${data.spike_status.is_planted ? `<div style="position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #ff4655; animation: pulse 1.5s infinite;"></div>` : ''}
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                                <span style="color: ${data.spike_status.is_planted ? '#ff4655' : '#64748b'}; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Spike Report</span>
                                <span style="color: ${data.spike_status.is_planted ? '#ff4655' : '#cbd5e1'}; font-size: 0.75rem; font-weight: bold; animation: ${data.spike_status.is_planted ? 'pulse 1.5s infinite' : 'none'};">${data.spike_status.status_msg}</span>
                            </div>
                            <div style="font-size: 0.82rem; color: #cbd5e1;">
                                ${data.spike_status.is_planted ? `STATUS: <b style="color: #ff4655;">PLANTED</b> | SECTOR: <b style="color: #00f5d4;">${data.location || 'UNKNOWN'}</b>` : `STATUS: <span style="color: #64748b;">NOT PLANTED</span>`}
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    <!-- SECTION 4: TACTICAL OPERATIONS -->
                    <div class="section-card">
                        <div class="section-header">🧠 Tactical Operations</div>
                        
                        ${data.visual_cues ? `
                        <div style="margin-bottom: 15px;">
                            <span style="color: #64748b; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px;">👁️ Visual Evidence</span>
                            <div style="background: rgba(255,255,255,0.02); padding: 10px; border-radius: 4px;">${visualHtml}</div>
                        </div>
                        ` : ''}

                        <div style="border-top: 1px solid rgba(0,245,212,0.1); padding-top: 12px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="color: #00f5d4; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px;">STRATEGIC ANALYSIS</span>
                                ${data.round_context && data.round_context.time ? `<span style="color: #64748b; font-size: 0.6rem;">TIMESTAMP: ${data.round_context.time}</span>` : ''}
                            </div>
                            <div style="max-height: 300px; overflow-y: auto; padding-right: 5px;">
                                ${tacticalHtml}
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin-top:5px; font-size:0.6rem; color:#3b82f6; display: flex; justify-content: space-between; opacity: 0.7;">
                        <span>CONFIDENCE: ${data.confidence || 'N/A'}</span>
                        <span>SOURCE: ${data.source || 'Gemini Vision + Precision Tracer'}</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>

</html>
