<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA // MAP INTELLIGENCE AGENT</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --riot-red: #ff4655;
            --tactical-cyan: #00f5d4;
            --neural-blue: #3b82f6;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(255, 70, 85, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--neural-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--neural-blue);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .upload-zone {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 60px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            margin-bottom: 30px;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--neural-blue);
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .upload-text {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: #94a3b8;
        }

        #preview-container {
            margin-top: 20px;
            display: none;
        }

        #image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .actions {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 4px;
            font-family: var(--font-main);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--riot-red);
            color: white;
            box-shadow: 0 0 20px rgba(255, 70, 85, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #results-area {
            display: none;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-left: 4px solid var(--tactical-cyan);
            padding: 30px;
            font-family: var(--font-mono);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            color: var(--tactical-cyan);
            font-size: 0.7rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 245, 212, 0.1);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .analysis-output {
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .analysis-output b {
            color: var(--neural-blue);
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        input[type="file"] {
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 3px;
            font-size: 0.65rem;
            color: var(--tactical-cyan);
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>AURORA // MAP AGENT <span class="badge">GEMINI VISION</span></h1>
            <p class="subtitle">Spatial Intelligence Interface · Powered by Gemini 1.5 Flash</p>
        </header>

        <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <span class="upload-icon">📡</span>
            <p class="upload-text">DRAG & DROP GAMEPLAY SCREENSHOT OR CLICK TO BROWSE</p>
            <div id="preview-container">
                <img id="image-preview" src="#" alt="Preview">
            </div>
        </div>

        <input type="file" id="file-input" accept="image/*">

        <div class="actions">
            <button id="analyze-btn" class="btn btn-primary" disabled onclick="runAnalysis()">
                <span class="loader" id="loader"></span>
                <span id="btn-text">INITIALIZE ANALYZER</span>
            </button>
        </div>

        <div id="results-area">
            <div class="result-header">
                <span>INTEL_STREAM · GEMINI VISION + ORACLE</span>
                <span id="timestamp">TIMESTAMP // --:--:--</span>
            </div>
            <div id="output-content" class="analysis-output">
                <!-- Analysis results will appear here -->
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('image-preview');
        const previewContainer = document.getElementById('preview-container');
        const analyzeBtn = document.getElementById('analyze-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');
        const resultsArea = document.getElementById('results-area');
        const outputContent = document.getElementById('output-content');
        const timestamp = document.getElementById('timestamp');

        let currentFile = null;

        // Drag & Drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
            dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            currentFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                previewContainer.style.display = 'block';
                dropZone.querySelector('.upload-icon').style.display = 'none';
                dropZone.querySelector('.upload-text').style.display = 'none';
                analyzeBtn.disabled = false;
                btnText.textContent = 'ANALYZE IMAGE';
            };
            reader.readAsDataURL(file);
        }

        async function runAnalysis() {
            if (!currentFile) return;
            analyzeBtn.disabled = true;
            loader.style.display = 'inline-block';
            btnText.textContent = 'GEMINI VISION PROCESSING...';
            resultsArea.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', currentFile);

                const response = await fetch('http://localhost:8001/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Server error');
                }

                displayResults(await response.json());

            } catch (e) {
                console.error('Analysis error:', e);
                displayResults({
                    map: 'AGENT OFFLINE',
                    location: 'N/A',
                    tactical_advice: `${e.message}. Make sure map_agent_server.py is running on port 8001.`,
                    confidence: 'none',
                    source: 'Connection Failed'
                });
            }

            resultsArea.style.display = 'block';
            loader.style.display = 'none';
            btnText.textContent = 'RUN NEW ANALYSIS';
            analyzeBtn.disabled = false;
        }

        function displayResults(data) {
            const now = new Date();
            timestamp.textContent = `TIMESTAMP // ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            const coordStr = data.coordinates
                ? `X: ${Math.round(data.coordinates.x)}, Y: ${Math.round(data.coordinates.y)}`
                : 'N/A';

            outputContent.innerHTML = `
                <p>📍 DETECTED MAP: <b>${data.map || 'UNKNOWN'}</b></p>
                <p>🛰️ LOCATION: <b>${data.location || 'UNKNOWN'}</b></p>
                <p>🎯 ZONE: <b>${data.super_region || 'N/A'}</b></p>
                <p>📐 COORDINATES: <b>${coordStr}</b></p>
                ${data.visual_cues ? `<p style="color:#64748b;font-size:0.8rem;margin-top:8px;">👁️ VISUAL CUES: ${data.visual_cues}</p>` : ''}
                <div style="margin-top:16px;color:#00f5d4;font-size:0.85rem;border-top:1px solid rgba(0,245,212,0.15);padding-top:12px;">
                    🧠 TACTICAL ADVICE: ${data.tactical_advice}
                </div>
                <div style="margin-top:10px;font-size:0.7rem;color:#3b82f6;">
                    CONFIDENCE: ${data.confidence || 'N/A'} &nbsp;|&nbsp; SOURCE: ${data.source || 'Gemini Vision + Oracle'}
                </div>
            `;
        }
    </script>
</body>

</html>
